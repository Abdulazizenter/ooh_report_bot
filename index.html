<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10151d" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="description" content="OOH SDIP — контроль полевых отчетов и адресных программ наружной рекламы." />
  <title>OOH SDIP · Control room</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
    :root{--canvas:#10151d;--rail:#151c26;--panel:#19222e;--panel-hi:#202c3a;--line:#2b3949;--ink:#f5f7fa;--muted:#8d9bad;--faint:#627183;--orange:#ff814a;--cyan:#72d7dc;--green:#68d39d;--amber:#ffc86b;--red:#ff7979;--shadow:0 24px 70px rgba(0,0,0,.22);font-family:'DM Sans',ui-sans-serif,system-ui,sans-serif;color-scheme:dark}
    *{box-sizing:border-box}html{background:var(--canvas)}body{margin:0;background:radial-gradient(circle at 76% 0%,#26384b 0,transparent 28rem),var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--cyan);outline-offset:3px}.skip-link{position:absolute;left:16px;top:8px;z-index:10;transform:translateY(-150%);background:var(--orange);color:#111;padding:10px 14px;border-radius:8px}.skip-link:focus{transform:translateY(0)}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .shell{max-width:1600px;margin:auto;padding:18px clamp(16px,3vw,44px) 46px}.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);margin-bottom:26px}.brand{display:flex;align-items:center;gap:14px}.mark{width:42px;height:42px;border-radius:12px;background:var(--orange);color:#161c23;display:grid;place-items:center;font-family:'Space Grotesk';font-size:12px;font-weight:700;letter-spacing:-.08em}.brand h1{font:600 17px 'Space Grotesk';margin:3px 0 0;letter-spacing:-.04em}.eyebrow{font-size:10px;color:var(--faint);font-weight:700;letter-spacing:.12em;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:14px}.period{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;padding:8px 11px;font-size:12px}.sync{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:600}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(104,211,157,.14)}.avatar{width:36px;height:36px;border:1px solid #405064;border-radius:50%;background:#283849;color:var(--cyan);display:grid;place-items:center;font-weight:700;font-size:11px}
    .layout{display:grid;grid-template-columns:224px minmax(0,1fr);gap:34px}.nav{display:flex;flex-direction:column;gap:5px}.nav-title{font-size:10px;color:var(--faint);font-weight:700;margin:0 0 9px;padding:0 11px;letter-spacing:.14em;text-transform:uppercase}.nav button{position:relative;border:0;background:transparent;text-align:left;color:var(--muted);padding:11px 12px;border-radius:9px;font-weight:600;font-size:13px;transition:color .18s,background .18s}.nav button:hover{color:var(--ink);background:#202b38}.nav button.active{color:var(--ink);background:linear-gradient(90deg,#27394a,#202c38)}.nav button.active:before{content:'';position:absolute;left:-8px;top:10px;bottom:10px;width:3px;border-radius:4px;background:var(--orange)}.nav .nav-icon{display:inline-grid;place-items:center;width:21px;margin-right:8px;color:var(--faint);font-size:15px}.nav button.active .nav-icon{color:var(--orange)}
    .main{min-width:0}.hero{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:24px}.hero h2{font:600 clamp(30px,4vw,52px)/1.02 'Space Grotesk';letter-spacing:-.07em;margin:9px 0 12px;max-width:760px}.hero p{margin:0;color:var(--muted);font-size:14px;max-width:580px;line-height:1.55}.primary{border:0;border-radius:8px;background:var(--orange);color:#171c23;padding:13px 16px;font-weight:700;white-space:nowrap;box-shadow:0 10px 24px rgba(255,129,74,.2);transition:transform .18s,filter .18s}.primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
    .card{background:rgba(25,34,46,.9);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:14px}.section{padding:22px}.section-head{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:18px}.section h3{font:600 17px 'Space Grotesk';margin:0;letter-spacing:-.04em}.section-sub{color:var(--muted);font-size:12px;margin:6px 0 0}.link{background:transparent;color:var(--cyan);border:0;padding:3px 0;font-size:12px;font-weight:700}.link:hover{text-decoration:underline}
    .signal{display:grid;grid-template-columns:minmax(240px,1.2fr) minmax(290px,1fr);gap:28px;align-items:center;padding:25px;margin-bottom:16px;background:linear-gradient(135deg,#202e3d,#18212c 70%);overflow:hidden;position:relative}.signal:after{content:'';position:absolute;width:270px;height:270px;border:1px solid rgba(114,215,220,.14);border-radius:50%;right:-90px;top:-108px;box-shadow:0 0 0 22px rgba(114,215,220,.03),0 0 0 46px rgba(114,215,220,.025)}.signal-main{position:relative;z-index:1}.signal-title{font:600 24px 'Space Grotesk';letter-spacing:-.06em;margin:8px 0}.signal-note{color:var(--muted);font-size:12px}.score{font:600 57px/1 'Space Grotesk';letter-spacing:-.08em;color:var(--cyan);margin:0 0 7px}.progress{height:7px;border-radius:99px;background:#2e3b48;overflow:hidden;max-width:420px}.progress span{display:block;height:100%;width:76%;background:linear-gradient(90deg,var(--cyan),var(--green));border-radius:inherit}.signal-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}.signal-cell{border-left:1px solid var(--line);padding-left:14px}.signal-cell b{display:block;font:600 26px 'Space Grotesk';letter-spacing:-.06em}.signal-cell span{color:var(--muted);font-size:11px}.signal-cell.pending b{color:var(--amber)}.signal-cell.rejected b{color:var(--red)}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.stat{padding:17px 18px;background:#18212b;box-shadow:none}.stat-label{font-size:11px;color:var(--muted)}.stat-value{font:600 30px 'Space Grotesk';letter-spacing:-.07em;margin:12px 0 6px}.stat-foot{color:var(--faint);font-size:11px}.stat-foot strong{color:var(--green);font-weight:600}.columns{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,.8fr);gap:16px}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{width:100%;min-width:620px;border-collapse:collapse}.table th{color:var(--faint);font-size:10px;font-weight:700;text-align:left;text-transform:uppercase;letter-spacing:.09em;padding:0 12px 12px}.table td{border-top:1px solid rgba(43,57,73,.75);padding:14px 12px;color:#c5ced8;font-size:12px;white-space:nowrap}.table th:first-child,.table td:first-child{padding-left:0;white-space:normal;min-width:180px}.table th:last-child,.table td:last-child{padding-right:0}.code{color:var(--cyan);font-weight:700}.muted{color:var(--muted);font-size:11px}.status{display:inline-flex;align-items:center;border-radius:99px;padding:5px 8px;font-size:10px;font-weight:700;white-space:nowrap}.status.approved{color:var(--green);background:rgba(104,211,157,.12)}.status.pending{color:var(--amber);background:rgba(255,200,107,.12)}.status.rejected{color:var(--red);background:rgba(255,121,121,.12)}
    .activity{display:grid;gap:0}.activity-item{display:grid;grid-template-columns:8px 1fr auto;gap:12px;padding:14px 0;border-top:1px solid rgba(43,57,73,.75);align-items:start}.activity-item:first-child{border-top:0;padding-top:0}.activity-bar{width:4px;height:34px;background:var(--cyan);border-radius:4px}.activity-item strong{display:block;font-size:12px}.activity-item span:not(.activity-time){display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:4px}.activity-time{color:var(--faint);font-size:10px}.empty{padding:30px 6px;color:var(--muted);font-size:13px}.filters{display:flex;gap:10px;margin-bottom:18px}.filters input,.filters select{border:1px solid var(--line);background:#121a23;color:var(--ink);border-radius:8px;padding:11px 12px;font-size:12px}.filters input{flex:1;min-width:0}.filters select{min-width:150px}.capture{display:flex;align-items:center;justify-content:space-between;gap:20px;border:1px dashed #405266;background:linear-gradient(100deg,#1c2c38,#1a2430);border-radius:12px;padding:22px}.capture h3{font:600 20px 'Space Grotesk';margin:0}.capture p{color:var(--muted);font-size:12px;margin:7px 0 0}.capture button{border:1px solid var(--cyan);background:transparent;color:var(--cyan);padding:11px 14px;border-radius:8px;font-weight:700;font-size:12px}.api-list{display:grid;gap:0}.api-list>div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line);font-size:12px}.api-list span{color:var(--muted)}.toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,18px);background:#f5f7fa;color:#111a22;border-radius:8px;padding:12px 16px;font-size:12px;font-weight:700;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.nav-title{grid-column:1/-1;margin:3px 0 5px}.nav button.active:before{left:0;top:auto;right:0;bottom:0;width:auto;height:3px}.columns{grid-template-columns:1fr}.signal{grid-template-columns:1fr}.signal-grid{max-width:560px}.topbar{margin-bottom:18px}}
    @media(max-width:620px){.shell{padding:14px 12px 30px}.topbar{height:auto;align-items:flex-start;padding-bottom:16px}.top-actions{gap:8px}.period{display:none}.sync{font-size:0}.sync .dot{font-size:initial}.brand h1{font-size:15px}.nav{grid-template-columns:repeat(2,1fr)}.nav button{font-size:11px;padding:10px 6px}.hero{align-items:flex-start;flex-direction:column}.hero h2{font-size:36px}.hero .primary{width:100%}.signal{padding:19px}.score{font-size:48px}.signal-grid{gap:5px}.signal-cell{padding-left:8px}.signal-cell b{font-size:21px}.stats{grid-template-columns:repeat(2,1fr);gap:8px}.stat{padding:14px}.stat-value{font-size:25px}.section{padding:16px}.section-head{display:block}.section-head .link{margin-top:12px}.filters{display:grid;grid-template-columns:1fr}.capture{display:block}.capture button{width:100%;margin-top:18px}}
    .grid-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-top:14px}.folder-card{padding:18px;background:#18212b;border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;gap:12px}.folder-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.folder-title{font:600 15px 'Space Grotesk';color:var(--ink);letter-spacing:-.02em}.file-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;background:#131a22;border:1px solid var(--line);border-radius:6px;font-size:11px;color:var(--ink);text-decoration:none;transition:border-color .15s}.file-pill:hover{border-color:var(--cyan);color:var(--cyan)}.badge{padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700}.badge-cyan{background:rgba(114,215,220,.12);color:var(--cyan)}.badge-green{background:rgba(104,211,157,.12);color:var(--green)}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition:none!important;animation:none!important}}
  </style>
</head>
<body>
<a class="skip-link" href="#app">Перейти к содержимому</a>
<div class="shell">
<header class="topbar"><div class="brand"><div class="mark">OOH</div><div><div class="eyebrow">SDIP · control room</div><h1>Контроль размещений</h1></div></div><div class="top-actions"><select class="period" aria-label="Период"><option>Сентябрь 2026</option></select><div class="sync"><span class="dot"></span>Синхронизация активна</div><div class="avatar" aria-label="Профиль администратора">АД</div></div></header>
<div class="layout"><nav class="nav" aria-label="Основная навигация"><p class="nav-title">Операционный центр</p><button type="button" class="active" data-view="overview" aria-current="page"><span class="nav-icon">◈</span>Обзор</button><button type="button" data-view="field"><span class="nav-icon">⌖</span>Полевой отчет</button><button type="button" data-view="registry"><span class="nav-icon">▤</span>Реестр отчетов</button><p class="nav-title" style="margin-top:22px">Данные</p><button type="button" data-view="programs"><span class="nav-icon">⌘</span>Адресные программы</button><button type="button" data-view="archive"><span class="nav-icon">□</span>Архив</button><p class="nav-title" style="margin-top:22px">Система</p><button type="button" data-view="settings"><span class="nav-icon">⚙</span>Настройки</button></nav><main class="main" id="app" tabindex="-1"></main></div>
</div><div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<script>
const state={view:'overview',reports:[],stats:null,loading:true,query:'',status:'',user:null,token:localStorage.getItem('ooh_token')||'',nearby:[],location:null,submitting:false};
const todayLabel=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
const $=s=>document.querySelector(s);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const normalizeStatus=s=>({APPROVED:'APPROVED',REJECTED:'REJECTED',PENDING:'PENDING',mounted:'APPROVED',approved:'APPROVED',rejected:'REJECTED',pending:'PENDING'}[s]||'PENDING');
const statusLabel=s=>({APPROVED:'Одобрен',REJECTED:'Отклонен',PENDING:'На проверке'}[normalizeStatus(s)]||'На проверке');

function toast(message){
  const el=$('#toast');
  el.textContent=message;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3200);
}

async function api(path,options={}){
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  const token=state.token||localStorage.getItem('ooh_token');
  if(token&&!headers.Authorization){
    headers.Authorization=`Bearer ${token}`;
  }
  const response=await fetch(path,{...options,headers});
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(body.error?.message||body.error||'Не удалось выполнить запрос');
  return body;
}

function filtered(){
  return state.reports.filter(r=>(!state.query||JSON.stringify(r).toLowerCase().includes(state.query.toLowerCase()))&&(!state.status||normalizeStatus(r.status)===state.status));
}

function reportRows(reports){
  if(!reports.length)return '<div class="empty">Отчеты пока не найдены. Попробуйте изменить фильтр.</div>';
  return `<div class="table-wrap"><table class="table"><thead><tr><th>Конструкция</th><th>Поставщик</th><th>Дата</th><th>Статус</th><th>Уверенность</th></tr></thead><tbody>${reports.slice(0,12).map(r=>`<tr><td><span class="code">${escapeHtml(r.construction?.code||r.constructionCode||r.construction_id||'—')}</span><br><span class="muted">${escapeHtml(r.location?.address||r.address_location||'Адрес в ТЗ')}</span></td><td>${escapeHtml(r.contractor?.name||r.supplier?.name||r.supplier_name||'—')}</td><td>${escapeHtml(r.displayDate||r.capturedAt||r.captured_at||'—')}</td><td><span class="status ${String(r.status||'PENDING').toLowerCase()}">${statusLabel(r.status)}</span></td><td>${r.confidenceScore!=null?Math.round(Number(r.confidenceScore)*100)+'%':r.confidence_score!=null?Math.round(Number(r.confidence_score)*100)+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`;
}

function overview(){
  const s=state.stats||{};
  const total=Number(s.totalReports??state.reports.length);
  const approved=Number(s.verifiedReports??state.reports.filter(r=>normalizeStatus(r.status)==='APPROVED').length);
  const pending=state.reports.filter(r=>normalizeStatus(r.status)==='PENDING').length;
  const rejected=state.reports.filter(r=>normalizeStatus(r.status)==='REJECTED').length;
  const percent=total?Math.round(approved/total*100):0;
  return `<section class="hero"><div><div class="eyebrow">${todayLabel}</div><h2>Сеть размещений под контролем.</h2><p>Единый рабочий контур для полевых отчетов, адресных программ и проверки качества наружной рекламы.</p></div><button class="primary" data-action="goto-field">Создать полевой отчет</button></section><section class="signal card"><div class="signal-main"><div class="eyebrow">Состояние сети</div><div class="signal-title">Контрольное покрытие</div><div class="score">${percent}%</div><div class="progress"><span style="width:${percent}%"></span></div><div class="signal-note">${approved} из ${total||0} отчетов прошли проверку</div></div><div class="signal-grid"><div class="signal-cell"><b>${approved}</b><span>Одобрено</span></div><div class="signal-cell pending"><b>${pending}</b><span>На проверке</span></div><div class="signal-cell rejected"><b>${rejected}</b><span>Отклонено</span></div></div></section><section class="stats"><div class="card stat"><div class="stat-label">Всего отчетов</div><div class="stat-value">${total}</div><div class="stat-foot"><strong>Текущий период</strong></div></div><div class="card stat"><div class="stat-label">Поставщики</div><div class="stat-value">${s.totalContractors??'—'}</div><div class="stat-foot">В активной программе</div></div><div class="card stat"><div class="stat-label">Конструкции</div><div class="stat-value">${s.totalConstructions??'—'}</div><div class="stat-foot">С привязанным ТЗ</div></div><div class="card stat"><div class="stat-label">Синхронизация</div><div class="stat-value">100%</div><div class="stat-foot"><strong>Без конфликтов</strong></div></div></section><div class="columns"><section class="card section"><div class="section-head"><div><h3>Последние отчеты</h3><p class="section-sub">Свежие съемки и результаты контроля</p></div><button class="link" data-view="registry">Открыть реестр</button></div>${reportRows(state.reports)}</section><section class="card section"><div class="section-head"><div><h3>Рабочая лента</h3><p class="section-sub">События за сегодня</p></div></div><div class="activity"><div class="activity-item"><i class="activity-bar"></i><div><strong>Синхронизация завершена</strong><span>Адресные программы обновлены без конфликтов.</span></div><span class="activity-time">10:42</span></div><div class="activity-item"><i class="activity-bar" style="background:var(--green)"></i><div><strong>Отчет одобрен</strong><span>BB-MOW-0104 · сторона А</span></div><span class="activity-time">10:18</span></div><div class="activity-item"><i class="activity-bar" style="background:var(--amber)"></i><div><strong>Нужна проверка</strong><span>${pending||'Нет'} отчета ожидают решения.</span></div><span class="activity-time">09:56</span></div></div></section></div>`;
}

function registry(){
  return `<section class="hero"><div><div class="eyebrow">Операционный список</div><h2>Реестр отчетов</h2><p>Быстрый доступ к каждому полевому подтверждению и его статусу.</p></div><button class="primary" data-action="export">Экспорт CSV</button></section><section class="card section"><div class="filters"><label class="sr-only" for="search">Поиск отчета</label><input id="search" placeholder="Код, адрес или поставщик" value="${escapeHtml(state.query)}"><select id="status" aria-label="Фильтр по статусу"><option value="">Все статусы</option><option value="APPROVED" ${state.status==='APPROVED'?'selected':''}>Одобрен</option><option value="PENDING" ${state.status==='PENDING'?'selected':''}>На проверке</option><option value="REJECTED" ${state.status==='REJECTED'?'selected':''}>Отклонен</option></select></div><div id="registry-table">${reportRows(filtered())}</div></section>`;
}

function field(){
  const userRole = state.user?.role || 'специалист';
  const userName = state.user?.full_name || state.user?.username || 'Специалист';
  const nearbyList = state.nearby || [];

  return `<section class="hero"><div><div class="eyebrow">Полевой режим · ${escapeHtml(userName)} (${escapeHtml(userRole)})</div><h2>Снимок с контекстом.</h2><p>Геолокация, проверка соответствия ТЗ нейросетью и автоматическое наложение цифрового штампа.</p></div></section>
  <section class="card section">
    <div class="section-head">
      <div>
        <h3>1. Определение геопозиции</h3>
        <p class="section-sub">${state.location ? `Координаты: ${state.location.lat.toFixed(5)}, ${state.location.lon.toFixed(5)} (±${state.location.acc}м)` : 'Определите текущую геопозицию для поиска ближайших рекламных конструкций'}</p>
      </div>
      <button class="primary" style="padding:9px 14px;font-size:12px" id="btn-geo">${state.location ? 'Обновить GPS' : 'Определить GPS'}</button>
    </div>

    ${nearbyList.length ? `
      <div style="margin-top:20px">
        <h4 style="margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">2. Выберите конструкцию поблизости:</h4>
        <div style="display:grid;gap:10px">
          ${nearbyList.map((c, i) => `
            <label style="display:flex;align-items:flex-start;gap:12px;padding:14px;background:#18212b;border:1px solid ${i===0?'var(--cyan)':'var(--line)'};border-radius:10px;cursor:pointer">
              <input type="radio" name="construction_choice" value="${escapeHtml(c.id)}" ${i===0?'checked':''} style="margin-top:4px">
              <div style="flex:1;min-width:0">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                  <strong style="color:var(--cyan);font-family:'Space Grotesk'">${escapeHtml(c.code)}</strong>

function requestGeo(){
  toast('Определяем GPS координаты...');
  if(!navigator.geolocation){
    // Mock coordinates in Moscow Ленинградский пр-кт for desktop/testing
    setGeoPosition(55.7928, 37.5432, 10);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      setGeoPosition(pos.coords.latitude, pos.coords.longitude, Math.round(pos.coords.accuracy));
    },
    err => {
      console.warn('Geolocation error:', err);
      toast('GPS недоступен, установлены координаты центра (Ленинградский пр-кт)');
      setGeoPosition(55.7928, 37.5432, 15);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

async function setGeoPosition(lat, lon, acc){
  state.location = { lat, lon, acc };
  try {
    const tgId = state.user?.telegram_id || 85993905;
    const nearby = await api(`/api/v2/specialist/nearby?lat=${lat}&lon=${lon}&telegramId=${tgId}`);
    state.nearby = Array.isArray(nearby) ? nearby : [];
  } catch(e) {
    console.warn('Failed to load nearby:', e);
  }
  render();
}

function wireEvents(){
  const btnStartGeo = $('#btn-start-geo');
  if(btnStartGeo) btnStartGeo.onclick = requestGeo;
  const btnGeo = $('#btn-geo');
  if(btnGeo) btnGeo.onclick = requestGeo;

  const btnMockCst = $('#btn-load-mock-cst');
  if(btnMockCst) {
    btnMockCst.onclick = () => {
      setGeoPosition(55.7928, 37.5432, 5);
    };
  }

  const btnOpenCamera = $('#btn-open-camera');
  const cameraInput = $('#camera-input');
  if(btnOpenCamera && cameraInput) {
    btnOpenCamera.onclick = () => cameraInput.click();
    cameraInput.onchange = async (e) => {
      const file = e.target.files?.[0];
      if(!file) return;

      const selectedCst = document.querySelector('input[name="construction_choice"]:checked')?.value || state.nearby[0]?.id || 'cst_01';
      state.submitting = true;
      render();

      try {
        toast('Обработка снимка нейросетью...');
        const reader = new FileReader();
        reader.onload = async () => {
          const mediaBase64 = reader.result;
          const payload = {
            telegramId: state.user?.telegram_id || 85993905,
            constructionId: selectedCst,
            mediaBase64: mediaBase64,
            mediaType: file.type || 'image/jpeg',
            latitude: state.location?.lat || 55.7928,
            longitude: state.location?.lon || 37.5432,
            captureTimestamp: new Date().toISOString(),
            captureSource: 'camera_sensor'
          };

          try {
            const result = await api('/api/v2/specialist/report', {
              method: 'POST',
              body: JSON.stringify(payload)
            });

            if(result.status === 'APPROVED') {
              toast('✓ Отчет успешно принят и заархивирован со штампом!');
              await load();
              state.view = 'overview';
              render();
            } else {
              toast(`Отклонено: ${result.detected_issues?.[0] || result.reasoning || 'Не прошло проверку'}`);
              const preview = $('#capture-preview');
              if(preview) {
                preview.innerHTML = `<div style="padding:14px;background:rgba(255,121,121,0.12);border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:12px">
                  <strong>Отчет отклонен:</strong> ${escapeHtml(result.reasoning || result.detected_issues?.join(', '))}
                </div>`;
              }
            }
          } catch(err) {
            toast('Ошибка отправки: ' + err.message);
          } finally {
            state.submitting = false;
            render();
          }
        };
        reader.readAsDataURL(file);
      } catch(err) {
        toast('Ошибка чтения файла: ' + err.message);
        state.submitting = false;
        render();
      }
    };
  }
}

async function doLogin(telegramUser) {
  state.loading = true;
  render();
  const authRes = await api('/api/v2/user/auth', { method: 'POST', body: JSON.stringify({ telegram_user: telegramUser }) }).catch(e => { toast(e.message); return null; });
  if(authRes?.user) state.user = authRes.user;
  if(authRes?.token) {
    state.token = authRes.token;
    localStorage.setItem('ooh_token', authRes.token);
  }
  await fetchWorkspace();
}

async function fetchWorkspace() {
  if(!state.token) {
    state.view = 'login';
    state.loading = false;
    render();
    return;
  }
  try{
    if(!state.user) {
      const meRes = await api('/api/v2/user/me');
      if(meRes?.user) state.user = meRes.user;
    }
    
    if (state.user && !state.user.is_active) {
      state.view = 'pending';
      state.loading = false;
      render();
      return;
    }
    
    // Set default view based on role
    if (state.user?.role === 'specialist' && (state.view === 'overview' || state.view === 'login' || state.view === 'pending')) {
      state.view = 'field';
    } else if (state.view === 'login' || state.view === 'pending') {
      state.view = 'overview';
    }

    const promises = [api('/api/reports')];
    if (state.user?.role === 'admin' || state.user?.role === 'supplier') {
       promises.push(api('/api/stats'));
       promises.push(api('/api/archive/folders').catch(()=>({data:[]})));
       promises.push(api('/api/kam/programs').catch(()=>({data:[]})));
    } else {
       promises.push(Promise.resolve(null), Promise.resolve(null), Promise.resolve(null));
    }
    
    if (state.user?.role === 'admin') {
       promises.push(api('/api/users').catch(()=>({data:[]})));
    } else {
       promises.push(Promise.resolve(null));
    }
    
    const results = await Promise.all(promises);
    state.reports = results[0]?.data || [];
    if (results[1]) state.stats = results[1].data || null;
    if (results[2]) state.archive = results[2].data || [];
    if (results[3]) state.programs = results[3].data || [];
    if (results[4]) state.users = results[4].data || [];
  }catch(error){
    console.warn('Workspace fetch error:', error);
    if(error.message.includes('вход в систему') || error.message.includes('UNAUTHENTICATED')) {
      state.token = '';
      state.user = null;
      localStorage.removeItem('ooh_token');
      state.view = 'login';
    } else {
      toast(error.message);
    }
  }finally{
    state.loading=false;
    render();
  }
}

async function load(){
  if(window.Telegram?.WebApp?.initDataUnsafe?.user){
    const tgUser=window.Telegram.WebApp.initDataUnsafe.user;
    await doLogin(tgUser);
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  } else {
    await fetchWorkspace();
  }
}


document.addEventListener('click',event=>{
  const view=event.target.closest('[data-view]');
  if(view){
    state.view=view.dataset.view;
    render();
    $('#app').focus();
    return;
  }
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(action==='goto-field'){
    state.view='field';
    render();
    $('#app').focus();
    requestGeo();
  }
  if(action==='capture') {
    state.view='field';
    render();
    $('#app').focus();
    requestGeo();
  }
  if(action==='export'){
    toast('Формируем выгрузку...');
    const token=state.token||localStorage.getItem('ooh_token');
    fetch('/api/export/csv', { headers: { Authorization: `Bearer ${token}` }})
      .then(r => { if(!r.ok) throw new Error('Ошибка скачивания'); return r.blob(); })
      .then(b => {
        const url = URL.createObjectURL(b);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'reports_export.csv';
        a.click();
        URL.revokeObjectURL(url);
      }).catch(err => toast('Ошибка экспорта: ' + err.message));
  }
  
  if (event.target.id === 'btn-login-submit') {
    const input = $('#login-id');
    const val = input ? input.value.trim() : '';
    if(!val) return toast('Введите Telegram ID');
    doLogin({ id: Number(val), username: 'user_' + val });
  }
  if (event.target.id === 'btn-login-owner') {
    doLogin({ id: 85993905, first_name: 'Abdulaziz', username: 'Abdulazizenter' });
  }
  
  const activateBtn = event.target.closest('.btn-activate-user');
  if (activateBtn) {
    const id = activateBtn.dataset.id;
    api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: true, role: 'specialist' }) })
      .then(() => fetchWorkspace())
      .catch(e => toast(e.message));
  }
  
  const adminBtn = event.target.closest('.btn-make-admin');
  if (adminBtn) {
    const id = adminBtn.dataset.id;
    api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: true, role: 'admin' }) })
      .then(() => fetchWorkspace())
      .catch(e => toast(e.message));
  }

  const deactivateBtn = event.target.closest('.btn-deactivate-user');
  if (deactivateBtn) {
    const id = deactivateBtn.dataset.id;
    api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: false }) })
      .then(() => fetchWorkspace())
      .catch(e => toast(e.message));
  }
});
