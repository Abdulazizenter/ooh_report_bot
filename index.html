<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6f4ef" />
  <meta name="description" content="OOH SDIP — контроль полевых отчетов и адресных программ наружной рекламы." />
  <title>OOH SDIP · Контроль размещений</title>
  <style>
    :root{--canvas:#f6f4ef;--panel:#fffdfa;--ink:#182027;--muted:#68737a;--line:#e4e1da;--orange:#e96527;--orange-dark:#bc481b;--blue:#2b6f8a;--green:#16825b;--amber:#b7791f;--red:#bd3f3f;--shadow:0 14px 40px rgba(42,38,30,.07);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    *{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}.shell{max-width:1500px;margin:auto;padding:22px clamp(16px,3vw,42px) 44px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:18px;margin-bottom:28px}.brand{display:flex;align-items:center;gap:13px}.mark{width:42px;height:42px;border-radius:14px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;letter-spacing:-.08em}.eyebrow{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.08em}.brand h1{font-size:18px;margin:2px 0 0;letter-spacing:-.03em}.top-actions{display:flex;align-items:center;gap:10px}.sync{display:flex;align-items:center;gap:8px;color:var(--green);font-size:12px;font-weight:700}.dot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px #dff2e9}.avatar{width:36px;height:36px;border-radius:50%;background:#e4eef1;color:var(--blue);display:grid;place-items:center;font-weight:800;font-size:12px}.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px}.nav{display:flex;flex-direction:column;gap:5px}.nav-title{font-size:11px;color:var(--muted);font-weight:800;margin:0 0 10px;padding:0 12px;text-transform:uppercase;letter-spacing:.08em}.nav button{border:0;background:transparent;text-align:left;color:var(--muted);padding:11px 12px;border-radius:10px;font-weight:700;font-size:13px}.nav button:hover,.nav button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}.nav button.active{box-shadow:inset 3px 0 var(--orange),var(--shadow)}.main{min-width:0}.hero{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:24px}.hero h2{font-size:clamp(27px,4vw,44px);line-height:1.05;letter-spacing:-.06em;margin:5px 0 9px}.hero p{color:var(--muted);margin:0;max-width:62ch;font-size:14px;line-height:1.6}.primary{border:0;background:var(--orange);color:#fff;padding:12px 16px;border-radius:10px;font-weight:800;box-shadow:0 8px 20px rgba(233,101,39,.22)}.primary:hover{background:var(--orange-dark)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:18px}.stat-label{color:var(--muted);font-size:12px;font-weight:700}.stat-value{font-size:28px;letter-spacing:-.05em;margin-top:9px;font-weight:850}.stat-foot{font-size:11px;color:var(--green);margin-top:6px;font-weight:700}.columns{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:18px}.section{padding:18px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.section h3{font-size:15px;margin:0;letter-spacing:-.02em}.section-sub{font-size:12px;color:var(--muted);margin:4px 0 0}.link{border:0;background:transparent;color:var(--blue);font-size:12px;font-weight:800}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:640px}.table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.07em;padding:0 10px 10px;border-bottom:1px solid var(--line)}.table td{padding:13px 10px;border-bottom:1px solid #efede8;font-size:12px;vertical-align:middle}.table tr:last-child td{border-bottom:0}.code{font-weight:850;color:var(--ink)}.muted{color:var(--muted)}.status{display:inline-flex;padding:5px 8px;border-radius:99px;font-size:10px;font-weight:850}.approved{background:#e4f5ed;color:var(--green)}.rejected{background:#fce9e8;color:var(--red)}.pending{background:#fff2d9;color:var(--amber)}.activity{display:flex;flex-direction:column;gap:15px}.activity-item{display:grid;grid-template-columns:9px 1fr auto;gap:10px;align-items:start}.activity-bar{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-top:5px}.activity-item strong{display:block;font-size:12px}.activity-item span{display:block;color:var(--muted);font-size:11px;line-height:1.45;margin-top:3px}.activity-time{font-size:10px!important;white-space:nowrap}.capture{margin-top:18px;background:var(--ink);color:white;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:20px;border-radius:16px}.capture h3{margin:0 0 5px;font-size:16px}.capture p{margin:0;color:#c7d0d2;font-size:12px;line-height:1.5}.capture button{background:var(--orange);border:0;color:white;border-radius:10px;padding:12px 15px;font-weight:850;white-space:nowrap}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 10px;color:var(--ink);font-size:12px}.empty{padding:28px;text-align:center;color:var(--muted);font-size:13px}.toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:13px 16px;border-radius:10px;font-size:12px;box-shadow:var(--shadow);opacity:0;transform:translateY(10px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@media(max-width:900px){.layout{grid-template-columns:1fr}.nav{flex-direction:row;overflow:auto;order:-1}.nav-title{display:none}.nav button{white-space:nowrap}.stats{grid-template-columns:repeat(2,1fr)}.columns{grid-template-columns:1fr}}@media(max-width:560px){.shell{padding:16px 14px 30px}.topbar{margin-bottom:22px}.sync{display:none}.hero{display:block}.hero .primary{margin-top:16px;width:100%}.stats{gap:8px}.stat{padding:14px}.stat-value{font-size:23px}.capture{display:block}.capture button{width:100%;margin-top:15px}.section{padding:14px}}
    .table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.table{min-width:620px}.table th,.table td{white-space:nowrap}.table th:first-child,.table td:first-child{white-space:normal;min-width:180px}.table th:nth-child(2),.table td:nth-child(2){white-space:normal;min-width:150px}.table td{line-height:1.35}.status{display:inline-flex;align-items:center;white-space:nowrap}.status.approved,.status.mounted{color:var(--green);background:#e4f4ec}.status.pending{color:var(--amber);background:#fff2d8}.status.rejected{color:var(--red);background:#fde7e5}.api-list{display:grid;gap:10px;margin-top:18px}.api-list>div{display:flex;justify-content:space-between;gap:16px;padding:14px 0;border-top:1px solid var(--line)}.api-list span{color:var(--muted);font-size:13px;text-align:right}@media(max-width:520px){.api-list>div{display:grid;gap:4px}.api-list span{text-align:left}}@media(max-width:900px){.shell{padding:16px 14px 32px}.layout{grid-template-columns:1fr;gap:18px}.nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.nav-title{grid-column:1/-1;margin:0!important}.nav button{padding:10px 8px;font-size:12px}.hero{align-items:flex-start;flex-direction:column}.hero .primary{width:100%}.columns{grid-template-columns:1fr}.topbar{align-items:flex-start}.sync{font-size:0}.sync .dot{font-size:initial}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){.brand h1{font-size:16px}.brand .eyebrow{font-size:9px}.stats{gap:8px}.stat-value{font-size:24px}.card{border-radius:14px}.section{padding:16px}.nav{grid-template-columns:repeat(2,minmax(0,1fr))}.nav button:last-child{grid-column:auto}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar"><div class="brand"><div class="mark">OOH</div><div><div class="eyebrow">SDIP / ОПЕРАЦИОННЫЙ ЦЕНТР</div><h1>Контроль размещений</h1></div></div><div class="top-actions"><div class="sync"><span class="dot"></span>Синхронизация активна</div><div class="avatar" aria-label="Профиль администратора">АД</div></div></header>
    <div class="layout">
      <nav class="nav" aria-label="Основная навигация"><p class="nav-title">Разделы</p><button class="active" data-view="overview">Обзор</button><button data-view="field">Полевой отчет</button><button data-view="registry">Реестр отчетов</button><button data-view="programs">Адресные программы</button><button data-view="archive">Архив</button><p class="nav-title" style="margin-top:22px">Система</p><button data-view="settings">Настройки</button></nav>
      <main class="main" id="app" tabindex="-1"></main>
    </div>
  </div>
  <div class="toast" id="toast" role="status"></div>
<script>
const state={view:'overview',reports:[],stats:null,loading:true,query:'',status:''};
const todayLabel=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
const $=s=>document.querySelector(s);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const normalizeStatus=s=>({APPROVED:'APPROVED',REJECTED:'REJECTED',PENDING:'PENDING',mounted:'APPROVED',approved:'APPROVED',rejected:'REJECTED',pending:'PENDING'}[s]||'PENDING');
const statusLabel=s=>({APPROVED:'Одобрен',REJECTED:'Отклонен',PENDING:'На проверке'}[normalizeStatus(s)]||'На проверке');
function toast(message){const el=$('#toast');el.textContent=message;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2600)}
async function api(path,options={}){const response=await fetch(path,{headers:{'Content-Type':'application/json',...(options.headers||{})},...options});const body=await response.json().catch(()=>({}));if(!response.ok)throw new Error(body.error?.message||body.error||'Не удалось выполнить запрос');return body}
function reportRows(reports){if(!reports.length)return '<div class="empty">Отчеты пока не найдены. Обновите данные или создайте первый отчет.</div>';return `<div class="table-wrap"><table class="table"><thead><tr><th>Конструкция</th><th>Поставщик</th><th>Дата</th><th>Статус</th><th>Уверенность</th></tr></thead><tbody>${reports.slice(0,8).map(r=>`<tr><td><span class="code">${escapeHtml(r.construction?.code||r.constructionCode||'—')}</span><br><span class="muted">${escapeHtml(r.location?.address||'Адрес не указан')}</span></td><td>${escapeHtml(r.contractor?.name||r.supplier?.name||'—')}</td><td>${escapeHtml(r.displayDate||r.capturedAt||'—')}</td><td><span class="status ${String(r.status||'PENDING').toLowerCase()}">${statusLabel(r.status)}</span></td><td>${r.confidenceScore!=null?Math.round(Number(r.confidenceScore)*100)+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`}
function overview(){const s=state.stats||{};return `<section class="hero"><div><div class="eyebrow">${todayLabel}</div><h2>Ситуация под контролем.</h2><p>Все полевые отчеты, адресные программы и сигналы проверки — в одном рабочем пространстве.</p></div><button class="primary" data-action="capture">Создать полевой отчет</button></section><section class="stats"><div class="card stat"><div class="stat-label">Всего отчетов</div><div class="stat-value">${s.totalReports??state.reports.length}</div><div class="stat-foot">За текущий период</div></div><div class="card stat"><div class="stat-label">Одобрено</div><div class="stat-value">${s.verifiedReports??state.reports.filter(r=>r.status==='APPROVED').length}</div><div class="stat-foot">Проходят проверку</div></div><div class="card stat"><div class="stat-label">Поставщики</div><div class="stat-value">${s.totalContractors??'—'}</div><div class="stat-foot">В активной программе</div></div><div class="card stat"><div class="stat-label">Конструкции</div><div class="stat-value">${s.totalConstructions??'—'}</div><div class="stat-foot">С привязанным ТЗ</div></div></section><div class="columns"><section class="card section"><div class="section-head"><div><h3>Последние отчеты</h3><p class="section-sub">Проверка состояния по свежим съемкам</p></div><button class="link" data-view="registry">Открыть реестр</button></div>${reportRows(state.reports)}</section><section class="card section"><div class="section-head"><div><h3>Рабочая лента</h3><p class="section-sub">События за сегодня</p></div></div><div class="activity"><div class="activity-item"><i class="activity-bar"></i><div><strong>Синхронизация завершена</strong><span>Данные программ обновлены без конфликтов.</span></div><span class="activity-time">10:42</span></div><div class="activity-item"><i class="activity-bar" style="background:var(--green)"></i><div><strong>Отчет одобрен</strong><span>BB-MOW-0104 · сторона А</span></div><span class="activity-time">10:18</span></div><div class="activity-item"><i class="activity-bar" style="background:var(--amber)"></i><div><strong>Нужна проверка</strong><span>Два отчета ожидают решения аудитора.</span></div><span class="activity-time">09:56</span></div></div></section></div><div class="capture"><div><h3>Вы на объекте?</h3><p>Выберите конструкцию рядом, разрешите геолокацию и снимите фото<br>только с камеры устройства.</p></div><button data-action="capture">Открыть камеру</button></div>`}
function registry(){return `<section class="hero"><div><div class="eyebrow">ОПЕРАЦИОННЫЙ СПИСОК</div><h2>Реестр отчетов</h2><p>Фильтруйте, просматривайте и передавайте отчеты на проверку без потери контекста.</p></div><button class="primary" data-action="export">Экспорт CSV</button></section><section class="card section"><div class="filters"><label class="sr-only" for="search">Поиск отчета</label><input id="search" placeholder="Код, адрес или поставщик" value="${escapeHtml(state.query)}"><select id="status"><option value="">Все статусы</option><option value="APPROVED">Одобрен</option><option value="PENDING">На проверке</option><option value="REJECTED">Отклонен</option></select></div><div id="registry-table">${reportRows(state.reports.filter(r=>(!state.query||JSON.stringify(r).toLowerCase().includes(state.query.toLowerCase()))&&(!state.status||normalizeStatus(r.status)===state.status)))}</div></section>`}
function field(){return `<section class="hero"><div><div class="eyebrow">ПОЛЕВАЯ РАБОТА</div><h2>Снимок с контекстом.</h2><p>Один понятный маршрут: геолокация, конструкция, камера, результат проверки.</p></div></section><section class="card section"><div class="section-head"><div><h3>Готовы зафиксировать размещение?</h3><p class="section-sub">Камера устройства используется без выбора файла из галереи.</p></div></div><div class="capture" style="margin-top:0"><div><h3>Начать съемку</h3><p>Сначала определим ближайшие конструкции и покажем требования по ТЗ.</p></div><button data-action="capture">Разрешить геолокацию</button></div></section>`}
function simple(title,desc){const isSettings=title==='Настройки';return `<section class="hero"><div><div class="eyebrow">${isSettings?'СИСТЕМА':'РАЗДЕЛ'}</div><h2>${title}</h2><p>${desc}</p></div></section><section class="card section">${isSettings?`<div class="section-head"><div><h3>Подключения приложения</h3><p class="section-sub">Интерфейс обращается только к внутреннему API OOH SDIP.</p></div><span class="status approved">Работает</span></div><div class="api-list"><div><strong>Рабочие данные</strong><span>GET /api/reports · GET /api/stats</span></div><div><strong>Реестр</strong><span>GET /api/export/csv</span></div><div><strong>Состояние сервера</strong><span>GET /health</span></div></div>`:`<div class="empty">Раздел подключен к единому API. Здесь появятся данные после загрузки программы.</div>`}</section>`}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));$('#app').innerHTML=state.loading?'<div class="card section empty">Загружаем рабочие данные…</div>':state.view==='overview'?overview():state.view==='registry'?registry():state.view==='field'?field():state.view==='programs'?simple('Адресные программы','Создавайте мастер-файлы КАМ, задавайте критерии и отслеживайте покрытие объектов.'):state.view==='archive'?simple('Архив','Папки поставщиков и месячные срезы отчетов доступны из единого журнала.'):simple('Настройки','Управление профилем, синхронизацией и правилами проверки.');}
async function load(){try{const [reports,stats]=await Promise.all([api('/api/reports'),api('/api/stats')]);state.reports=reports.data||[];state.stats=stats.data||null}catch(error){toast(error.message);try{const reports=await api('/api/reports');state.reports=reports.data||[]}catch{}}finally{state.loading=false;render()}}
document.addEventListener('click',event=>{const view=event.target.closest('[data-view]');if(view){state.view=view.dataset.view;render();$('#app').focus();return}const action=event.target.closest('[data-action]')?.dataset.action;if(action==='capture')toast('Откройте полевой режим на мобильном устройстве для запуска камеры');if(action==='export')window.location.href='/api/export/csv'});document.addEventListener('input',event=>{if(event.target.id==='search'){state.query=event.target.value;$('#registry-table').innerHTML=reportRows(state.reports.filter(r=>(!state.query||JSON.stringify(r).toLowerCase().includes(state.query.toLowerCase()))&&(!state.status||normalizeStatus(r.status)===state.status)))}});document.addEventListener('change',event=>{if(event.target.id==='status'){state.status=event.target.value;$('#registry-table').innerHTML=reportRows(state.reports.filter(r=>(!state.query||JSON.stringify(r).toLowerCase().includes(state.query.toLowerCase()))&&(!state.status||normalizeStatus(r.status)===state.status)))}});document.querySelectorAll('.nav button').forEach(()=>{});load();
</script>
</body>
</html>
