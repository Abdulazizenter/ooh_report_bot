<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#10151d" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta name="description" content="OOH SDIP — контроль полевых отчетов и адресных программ наружной рекламы." />
  <title>OOH SDIP · Control room</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..700;1,9..40,400..700&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');

    :root {
      /* Obsidian Surface Elevation Palette */
      --canvas: #090d12;
      --canvas-subtle: #0d1218;
      --surface-1: #121820;
      --surface-2: #16202b;
      --surface-3: #1c2836;
      --surface-hover: #213042;
      
      /* Surgical Borders & Separators */
      --line: #222f3e;
      --line-subtle: #192330;
      --line-focus: #38bdf8;
      
      /* High Contrast Typography */
      --ink: #f1f5f9;
      --ink-secondary: #cbd5e1;
      --muted: #8292a4;
      --faint: #4d5d71;
      
      /* Tactical Status & Accent Accents */
      --accent: #f97316;
      --accent-glow: rgba(249, 115, 22, 0.16);
      --cyan: #38bdf8;
      --cyan-glow: rgba(56, 189, 248, 0.14);
      --green: #34d399;
      --green-glow: rgba(52, 211, 153, 0.14);
      --amber: #fbbf24;
      --amber-glow: rgba(251, 191, 36, 0.14);
      --red: #f87171;
      --red-glow: rgba(248, 113, 113, 0.14);

      /* Typography Scale (Major Third 1.250) */
      --font-body: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      --font-display: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.35);
      --shadow-md: 0 4px 16px -2px rgba(0, 0, 0, 0.45);
      --shadow-lg: 0 16px 36px -4px rgba(0, 0, 0, 0.6);
      color-scheme: dark;
    }

    * { box-sizing: border-box; }
    html {
      background: var(--canvas);
      color: var(--ink);
      font-family: var(--font-body);
      font-feature-settings: "cv02", "cv03", "cv04", "cv11";
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--canvas);
      background-image: 
        radial-gradient(rgba(255, 255, 255, 0.04) 1px, transparent 1px),
        radial-gradient(ellipse 65% 35% at 50% 0%, rgba(56, 189, 248, 0.05), transparent);
      background-size: 24px 24px, 100% 100%;
      background-position: 0 0, 0 0;
    }

    button, input, select, textarea { font-family: inherit; }
    button { cursor: pointer; touch-action: manipulation; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--line-focus);
      outline-offset: 2px;
    }

    .skip-link {
      position: absolute;
      left: 16px;
      top: 8px;
      z-index: 100;
      transform: translateY(-160%);
      background: var(--accent);
      color: #090d12;
      padding: 8px 14px;
      font-weight: 700;
      font-size: 13px;
      border-radius: var(--radius-sm);
      transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .skip-link:focus { transform: translateY(0); }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    /* Tabular data & Mono markers */
    .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
    .tabular { font-variant-numeric: tabular-nums; }

    /* Shell Layout */
    .shell {
      max-width: 1540px;
      margin: 0 auto;
      padding: 16px clamp(16px, 2.5vw, 40px) 48px;
    }

    /* Topbar */
    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 28px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .mark {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: var(--accent);
      color: #090d12;
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: -0.04em;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .brand h1 {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      margin: 2px 0 0;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .period {
      border: 1px solid var(--line);
      background: var(--surface-1);
      color: var(--ink-secondary);
      border-radius: var(--radius-sm);
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 500;
      transition: border-color 0.15s;
    }
    .period:hover { border-color: var(--muted); }
    .sync {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--green);
      font-size: 12px;
      font-weight: 600;
      font-family: var(--font-mono);
      padding: 5px 10px;
      border-radius: var(--radius-sm);
      background: var(--green-glow);
      border: 1px solid rgba(52, 211, 153, 0.2);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 8px var(--green);
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      border: 1px solid var(--line);
      color: var(--cyan);
      display: grid;
      place-items: center;
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 12px;
    }

    /* Grid Layout */
    .layout {
      display: grid;
      grid-template-columns: 216px minmax(0, 1fr);
      gap: 32px;
    }

    /* Navigation */
    .nav {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .nav-title {
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--faint);
      font-weight: 600;
      margin: 16px 0 6px;
      padding: 0 10px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }
    .nav-title:first-child { margin-top: 0; }
    .nav button {
      position: relative;
      border: 1px solid transparent;
      background: transparent;
      text-align: left;
      color: var(--muted);
      padding: 9px 12px;
      border-radius: var(--radius-sm);
      font-weight: 500;
      font-size: 13px;
      display: flex;
      align-items: center;
      transition: color 0.15s, background 0.15s, border-color 0.15s;
    }
    .nav button:hover {
      color: var(--ink);
      background: var(--surface-1);
    }
    .nav button.active {
      color: var(--ink);
      background: var(--surface-2);
      border-color: var(--line);
      font-weight: 600;
    }
    .nav button.active::before {
      content: '';
      position: absolute;
      left: -1px;
      top: 6px;
      bottom: 6px;
      width: 3px;
      border-radius: 2px;
      background: var(--accent);
    }
    .nav .nav-icon {
      display: inline-grid;
      place-items: center;
      width: 20px;
      margin-right: 10px;
      color: var(--faint);
      font-size: 14px;
    }
    .nav button.active .nav-icon { color: var(--accent); }

    /* Main Area */
    .main { min-width: 0; }
    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      margin-bottom: 24px;
    }
    .hero h2 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: clamp(26px, 3.2vw, 42px);
      line-height: 1.08;
      letter-spacing: -0.04em;
      margin: 6px 0 8px;
      color: var(--ink);
    }
    .hero p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      max-width: 580px;
      line-height: 1.5;
    }

    /* Buttons */
    .primary {
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: #090d12;
      padding: 9px 16px;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: -0.01em;
      white-space: nowrap;
      box-shadow: 0 4px 14px var(--accent-glow);
      transition: background 0.15s, transform 0.12s, box-shadow 0.15s;
    }
    .primary:hover {
      background: #fb923c;
      transform: translateY(-1px);
      box-shadow: 0 6px 18px rgba(249, 115, 22, 0.28);
    }
    .primary:active {
      transform: translateY(0);
    }
    .primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    /* Cards & Containers */
    .card {
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
    }
    .section {
      padding: 20px 22px;
    }
    .section-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }
    .section h3 {
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      margin: 0;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    .section-sub {
      color: var(--muted);
      font-size: 12px;
      margin: 4px 0 0;
    }
    .link {
      background: transparent;
      color: var(--cyan);
      border: 0;
      padding: 4px 0;
      font-size: 12px;
      font-weight: 600;
      transition: color 0.15s;
    }
    .link:hover { color: #7dd3fc; text-decoration: underline; }

    /* Signal / Network Coverage HUD Card */
    .signal {
      display: grid;
      grid-template-columns: minmax(260px, 1.1fr) minmax(300px, 1fr);
      gap: 28px;
      align-items: center;
      padding: 24px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, var(--surface-2) 0%, var(--surface-1) 100%);
      border: 1px solid var(--line);
      position: relative;
      overflow: hidden;
    }
    .signal::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--cyan), transparent 60%);
    }
    .signal-main { position: relative; z-index: 1; }
    .signal-title {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
      margin: 6px 0 8px;
    }
    .signal-note { color: var(--muted); font-size: 12px; }
    .score {
      font-family: var(--font-mono);
      font-size: 52px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: -0.04em;
      color: var(--cyan);
      margin: 0 0 10px;
      font-variant-numeric: tabular-nums;
    }
    .progress {
      height: 6px;
      border-radius: 99px;
      background: var(--surface-3);
      overflow: hidden;
      max-width: 380px;
    }
    .progress span {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--green));
      border-radius: inherit;
    }
    .signal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      position: relative;
      z-index: 1;
    }
    .signal-cell {
      border-left: 1px solid var(--line);
      padding-left: 14px;
    }
    .signal-cell b {
      display: block;
      font-family: var(--font-mono);
      font-size: 24px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--green);
      font-variant-numeric: tabular-nums;
    }
    .signal-cell span {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .signal-cell.pending b { color: var(--amber); }
    .signal-cell.rejected b { color: var(--red); }

    /* Metric Stats Strip */
    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 16px;
    }
    .stat {
      padding: 16px 18px;
      background: var(--surface-1);
    }
    .stat-label {
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.02em;
    }
    .stat-value {
      font-family: var(--font-mono);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.03em;
      margin: 10px 0 4px;
      color: var(--ink);
      font-variant-numeric: tabular-nums;
    }
    .stat-foot {
      color: var(--faint);
      font-size: 11px;
    }
    .stat-foot strong {
      color: var(--cyan);
      font-weight: 600;
    }

    /* Columns & Tables */
    .columns {
      display: grid;
      grid-template-columns: minmax(0, 1.55fr) minmax(280px, 0.85fr);
      gap: 16px;
    }
    .table-wrap {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .table {
      width: 100%;
      min-width: 600px;
      border-collapse: separate;
      border-spacing: 0;
    }
    .table th {
      color: var(--faint);
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 600;
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 0 12px 10px;
      border-bottom: 1px solid var(--line);
    }
    .table td {
      border-bottom: 1px solid var(--line-subtle);
      padding: 12px 12px;
      color: var(--ink-secondary);
      font-size: 12px;
      white-space: nowrap;
    }
    .table th:first-child, .table td:first-child { padding-left: 0; white-space: normal; min-width: 170px; }
    .table th:last-child, .table td:last-child { padding-right: 0; }
    .code {
      font-family: var(--font-mono);
      color: var(--cyan);
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .muted {
      color: var(--muted);
      font-size: 11px;
    }

    /* Status Badges */
    .status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      border-radius: var(--radius-sm);
      padding: 3px 8px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      white-space: nowrap;
      border: 1px solid transparent;
    }
    .status.approved {
      color: var(--green);
      background: var(--green-glow);
      border-color: rgba(52, 211, 153, 0.25);
    }
    .status.pending {
      color: var(--amber);
      background: var(--amber-glow);
      border-color: rgba(251, 191, 36, 0.25);
    }
    .status.rejected {
      color: var(--red);
      background: var(--red-glow);
      border-color: rgba(248, 113, 113, 0.25);
    }

    /* Activity Stream */
    .activity { display: grid; gap: 0; }
    .activity-item {
      display: grid;
      grid-template-columns: 4px 1fr auto;
      gap: 14px;
      padding: 12px 0;
      border-bottom: 1px solid var(--line-subtle);
      align-items: start;
    }
    .activity-item:last-child { border-bottom: 0; }
    .activity-bar {
      width: 4px;
      height: 32px;
      background: var(--cyan);
      border-radius: 2px;
    }
    .activity-item strong {
      display: block;
      font-size: 12px;
      color: var(--ink);
      font-weight: 600;
    }
    .activity-item span:not(.activity-time) {
      display: block;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.45;
      margin-top: 2px;
    }
    .activity-time {
      font-family: var(--font-mono);
      color: var(--faint);
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    /* Filters & Inputs */
    .filters {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }
    .filters input, .filters select {
      border: 1px solid var(--line);
      background: var(--canvas-subtle);
      color: var(--ink);
      border-radius: var(--radius-sm);
      padding: 9px 12px;
      font-size: 12px;
      transition: border-color 0.15s;
    }
    .filters input:hover, .filters select:hover { border-color: var(--muted); }
    .filters input:focus, .filters select:focus { border-color: var(--line-focus); }
    .filters input { flex: 1; min-width: 0; }
    .filters select { min-width: 140px; }

    /* Tactical Quick Role Switcher Cards */
    .role-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-quick-role {
      text-align: left;
      padding: 12px;
      background: var(--surface-1);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s, background 0.15s, transform 0.1s;
      cursor: pointer;
    }
    .btn-quick-role:hover {
      border-color: var(--cyan);
      background: var(--surface-2);
      transform: translateY(-1px);
    }
    .btn-quick-role .role-title {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 700;
      color: var(--ink);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn-quick-role .role-desc {
      font-size: 11px;
      color: var(--muted);
      margin-top: 4px;
      display: block;
    }

    /* Modals & Inspection HUD */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 12, 0.85);
      backdrop-filter: blur(8px);
      display: none;
      place-items: center;
      z-index: 100;
      padding: 16px;
      overflow-y: auto;
    }
    .modal-backdrop.open { display: grid; }
    .modal-dialog {
      background: var(--surface-1);
      border: 1px solid var(--line);
      box-shadow: var(--shadow-lg);
      border-radius: var(--radius-lg);
      width: 100%;
      max-width: 860px;
      overflow: hidden;
      animation: modalIn 0.18s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.97) translateY(6px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface-2);
    }
    .modal-header h3 {
      margin: 0;
      font-family: var(--font-display);
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .modal-close {
      background: transparent;
      border: 0;
      color: var(--muted);
      font-size: 20px;
      line-height: 1;
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: color 0.15s, background 0.15s;
    }
    .modal-close:hover { color: var(--ink); background: var(--surface-3); }
    .modal-body {
      padding: 24px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 22px;
    }
    @media(max-width: 760px) { .modal-body { grid-template-columns: 1fr; } }

    /* Photo Frame with HUD Digital Stamp Viewfinder */
    .photo-frame {
      position: relative;
      background: #06090d;
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      overflow: hidden;
      min-height: 320px;
      display: grid;
      place-items: center;
    }
    .photo-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .photo-hud {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 14px;
      background: linear-gradient(to top, rgba(6, 9, 13, 0.95) 0%, rgba(6, 9, 13, 0.7) 70%, transparent 100%);
      font-family: var(--font-mono);
      font-size: 11px;
      color: var(--cyan);
      line-height: 1.45;
      border-top: 1px solid rgba(56, 189, 248, 0.18);
    }
    .photo-hud-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 3px;
    }
    .photo-hud-item {
      display: flex;
      justify-content: space-between;
      gap: 8px;
    }
    .photo-hud-label { color: var(--muted); }

    .modal-details {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .detail-card {
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }
    .detail-card h4 {
      margin: 0 0 6px;
      font-family: var(--font-mono);
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    /* Excel Drag-and-Drop Zone */
    .dropzone {
      border: 1px dashed var(--muted);
      background: var(--surface-2);
      border-radius: var(--radius-md);
      padding: 32px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--cyan);
      background: var(--surface-3);
    }
    .dropzone-icon {
      font-size: 32px;
      margin-bottom: 10px;
      display: block;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translate(-50%, 16px);
      background: #f8fafc;
      color: #090d12;
      border-radius: var(--radius-sm);
      padding: 10px 18px;
      font-family: var(--font-mono);
      font-size: 12px;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.18s, transform 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 1000;
    }
    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    /* Badges & Tables */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 4px;
      font-family: var(--font-mono);
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.02em;
    }
    .badge-cyan { background: var(--cyan-glow); color: var(--cyan); border: 1px solid rgba(56, 189, 248, 0.25); }
    .badge-green { background: var(--green-glow); color: var(--green); border: 1px solid rgba(52, 211, 153, 0.25); }
    .badge-orange { background: var(--accent-glow); color: var(--accent); border: 1px solid rgba(249, 115, 22, 0.25); }
    
    .clickable-row { cursor: pointer; transition: background 0.12s; }
    .clickable-row:hover { background: var(--surface-2); }
    .empty { padding: 32px 12px; color: var(--muted); font-size: 13px; text-align: center; }

    /* Responsive */
    @media(max-width: 1040px) {
      .layout { grid-template-columns: 1fr; }
      .nav { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
      .nav-title { grid-column: 1 / -1; margin: 6px 0 2px; }
      .columns { grid-template-columns: 1fr; }
      .signal { grid-template-columns: 1fr; }
    }
    @media(max-width: 640px) {
      .shell { padding: 12px 14px 28px; }
      .topbar { height: auto; flex-wrap: wrap; padding-bottom: 12px; }
      .nav { grid-template-columns: repeat(2, 1fr); }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .hero { flex-direction: column; align-items: flex-start; }
      .hero .primary { width: 100%; }
      .role-grid { grid-template-columns: 1fr; }
    }
    @media(prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
        animation: none !important;
      }
    }
  </style>
</head>
<body>
<div class="shell">
<header class="topbar"><div class="brand"><div class="mark">OOH</div><div><div class="eyebrow">SDIP · control room</div><h1>Контроль размещений</h1></div></div><div class="top-actions"><select class="period" id="topbar-period" aria-label="Период"><option value="2026-09">Сентябрь 2026</option><option value="2026-10">Октябрь 2026</option><option value="2026-08">Август 2026</option></select><div class="sync"><span class="dot"></span>Синхронизация активна</div><div class="avatar" aria-label="Профиль администратора">АД</div></div></header>
<div class="layout"><nav class="nav" aria-label="Основная навигация"><p class="nav-title">Операционный центр</p><button type="button" class="active" data-view="overview" aria-current="page"><span class="nav-icon">◈</span>Обзор</button><button type="button" data-view="field"><span class="nav-icon">⌖</span>Полевой отчет</button><button type="button" data-view="registry"><span class="nav-icon">▤</span>Реестр отчетов</button><p class="nav-title" style="margin-top:22px">Данные</p><button type="button" data-view="programs"><span class="nav-icon">⌘</span>Адресные программы</button><button type="button" data-view="archive"><span class="nav-icon">□</span>Архив</button><p class="nav-title" style="margin-top:22px">Система</p><button type="button" data-view="settings"><span class="nav-icon">⚙</span>Настройки</button></nav><main class="main" id="app" tabindex="-1"></main></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<!-- Report Photo HUD Inspection Modal -->
<div class="modal-backdrop" id="report-modal" role="dialog" aria-modal="true" aria-labelledby="modal-report-title">
  <div class="modal-dialog">
    <div class="modal-header">
      <h3 id="modal-report-title">Карточка отчета</h3>
      <button class="modal-close" id="btn-close-report-modal" aria-label="Закрыть">✕</button>
    </div>
    <div class="modal-body" id="modal-report-content">
      <!-- Injected dynamically -->
    </div>
  </div>
</div>

<!-- Assign Supplier / Role Modal for Admin -->
<div class="modal-backdrop" id="user-modal" role="dialog" aria-modal="true" aria-labelledby="modal-user-title">
  <div class="modal-dialog" style="max-width:480px">
    <div class="modal-header">
      <h3 id="modal-user-title">Назначение роли и компании</h3>
      <button class="modal-close" id="btn-close-user-modal" aria-label="Закрыть">✕</button>
    </div>
    <div style="padding:24px;display:flex;flex-direction:column;gap:16px">
      <input type="hidden" id="assign-user-id" />
      <div>
        <label style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Пользователь</label>
        <div id="assign-user-name" style="font-weight:700;color:var(--ink)">—</div>
      </div>
      <div>
        <label for="assign-role-select" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Роль в системе</label>
        <select id="assign-role-select" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#121a23;color:#fff">
          <option value="specialist">Полевой исполнитель (Специалист)</option>
          <option value="contractor_lead">Главный исполнитель (КАМ Поставщика)</option>
          <option value="client">Заказчик (Рекламодатель)</option>
          <option value="admin">Администратор</option>
        </select>
      </div>
      <div>
        <label for="assign-supplier-select" style="display:block;font-size:12px;color:var(--muted);margin-bottom:6px">Компания-поставщик</label>
        <select id="assign-supplier-select" style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:#121a23;color:#fff">
          <!-- Populated from state.suppliers -->
        </select>
      </div>
      <div style="display:flex;justify-content:flex-end;gap:10px;margin-top:10px">
        <button class="modal-close" id="btn-cancel-user-modal" style="font-size:13px;padding:9px 16px;border-radius:8px;background:#202c3a;color:#fff">Отмена</button>
        <button class="primary" id="btn-save-user-assign" style="font-size:13px;padding:9px 18px">Сохранить доступ</button>
      </div>
    </div>
  </div>
</div>

<script>
const state={view:'overview',month:'2026-09',reports:[],stats:null,loading:true,query:'',status:'',user:null,token:localStorage.getItem('ooh_token')||'',nearby:[],location:null,submitting:false,suppliers:[],importPreview:null};
const todayLabel=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).format(new Date());
const $=s=>document.querySelector(s);
const escapeHtml=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const normalizeStatus=s=>({APPROVED:'APPROVED',REJECTED:'REJECTED',PENDING:'PENDING',mounted:'APPROVED',approved:'APPROVED',rejected:'REJECTED',pending:'PENDING'}[s]||'PENDING');
const statusLabel=s=>({APPROVED:'Одобрен',REJECTED:'Отклонен',PENDING:'На проверке'}[normalizeStatus(s)]||'На проверке');

function toast(message){
  const el=$('#toast');
  el.textContent=message;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),3200);
}

async function api(path,options={}){
  const headers={'Content-Type':'application/json',...(options.headers||{})};
  const token=state.token||localStorage.getItem('ooh_token');
  if(token&&!headers.Authorization){
    headers.Authorization=`Bearer ${token}`;
  }
  const response=await fetch(path,{...options,headers});
  const body=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(body.error?.message||body.error||'Не удалось выполнить запрос');
  return body;
}

function filtered(){
  return state.reports.filter(r=>(!state.query||JSON.stringify(r).toLowerCase().includes(state.query.toLowerCase()))&&(!state.status||normalizeStatus(r.status)===state.status));
}

function reportRows(reports){
  if(!reports.length)return '<div class="empty">Отчеты пока не найдены. Попробуйте изменить фильтр.</div>';
  return `<div class="table-wrap"><table class="table"><thead><tr><th>Конструкция</th><th>Поставщик</th><th>Дата</th><th>Статус</th><th>Уверенность</th></tr></thead><tbody>${reports.slice(0,16).map(r=>`<tr class="clickable-row btn-inspect-report" data-id="${escapeHtml(r.id)}"><td><span class="code">${escapeHtml(r.construction?.code||r.constructionCode||r.construction_id||'—')}</span><br><span class="muted">${escapeHtml(r.location?.address||r.address_location||'Адрес в ТЗ')}</span></td><td>${escapeHtml(r.contractor?.name||r.supplier?.name||r.supplier_name||'—')}</td><td>${escapeHtml(r.displayDate||r.capturedAt||r.captured_at||'—')}</td><td><span class="status ${String(r.status||'PENDING').toLowerCase()}">${statusLabel(r.status)}</span></td><td>${r.confidenceScore!=null?Math.round(Number(r.confidenceScore)*100)+'%':r.confidence_score!=null?Math.round(Number(r.confidence_score)*100)+'%':'—'}</td></tr>`).join('')}</tbody></table></div>`;
}

function overview(){
  const s=state.stats||{};
  const total=Number(s.totalReports??state.reports.length);
  const approved=Number(s.verifiedReports??state.reports.filter(r=>normalizeStatus(r.status)==='APPROVED').length);
  const pending=state.reports.filter(r=>normalizeStatus(r.status)==='PENDING').length;
  const rejected=state.reports.filter(r=>normalizeStatus(r.status)==='REJECTED').length;
  const percent=total?Math.round(approved/total*100):0;
  return `<section class="hero"><div><div class="eyebrow">${todayLabel}</div><h2>Сеть размещений под контролем.</h2><p>Единый рабочий контур для полевых отчетов, адресных программ и проверки качества наружной рекламы.</p></div><button class="primary" data-action="goto-field">Создать полевой отчет</button></section><section class="signal card"><div class="signal-main"><div class="eyebrow">Состояние сети</div><div class="signal-title">Контрольное покрытие</div><div class="score">${percent}%</div><div class="progress"><span style="width:${percent}%"></span></div><div class="signal-note">${approved} из ${total||0} отчетов прошли проверку</div></div><div class="signal-grid"><div class="signal-cell"><b>${approved}</b><span>Одобрено</span></div><div class="signal-cell pending"><b>${pending}</b><span>На проверке</span></div><div class="signal-cell rejected"><b>${rejected}</b><span>Отклонено</span></div></div></section><section class="stats"><div class="card stat"><div class="stat-label">Всего отчетов</div><div class="stat-value">${total}</div><div class="stat-foot"><strong>Текущий период</strong></div></div><div class="card stat"><div class="stat-label">Поставщики</div><div class="stat-value">${s.totalContractors??'—'}</div><div class="stat-foot">В активной программе</div></div><div class="card stat"><div class="stat-label">Конструкции</div><div class="stat-value">${s.totalConstructions??'—'}</div><div class="stat-foot">С привязанным ТЗ</div></div><div class="card stat"><div class="stat-label">Синхронизация</div><div class="stat-value">100%</div><div class="stat-foot"><strong>Без конфликтов</strong></div></div></section><div class="columns"><section class="card section"><div class="section-head"><div><h3>Последние отчеты</h3><p class="section-sub">Свежие съемки и результаты контроля</p></div><button class="link" data-view="registry">Открыть реестр</button></div>${reportRows(state.reports)}</section><section class="card section"><div class="section-head"><div><h3>Рабочая лента</h3><p class="section-sub">События за сегодня</p></div></div><div class="activity"><div class="activity-item"><i class="activity-bar"></i><div><strong>Синхронизация завершена</strong><span>Адресные программы обновлены без конфликтов.</span></div><span class="activity-time">10:42</span></div><div class="activity-item"><i class="activity-bar" style="background:var(--green)"></i><div><strong>Отчет одобрен</strong><span>BB-MOW-0104 · сторона А</span></div><span class="activity-time">10:18</span></div><div class="activity-item"><i class="activity-bar" style="background:var(--amber)"></i><div><strong>Нужна проверка</strong><span>${pending||'Нет'} отчета ожидают решения.</span></div><span class="activity-time">09:56</span></div></div></section></div>`;
}

function registry(){
  return `<section class="hero"><div><div class="eyebrow">Операционный список</div><h2>Реестр отчетов</h2><p>Быстрый доступ к каждому полевому подтверждению и его статусу.</p></div><button class="primary" data-action="export">Экспорт CSV</button></section><section class="card section"><div class="filters"><label class="sr-only" for="search">Поиск отчета</label><input id="search" placeholder="Код, адрес или поставщик" value="${escapeHtml(state.query)}"><select id="status" aria-label="Фильтр по статусу"><option value="">Все статусы</option><option value="APPROVED" ${state.status==='APPROVED'?'selected':''}>Одобрен</option><option value="PENDING" ${state.status==='PENDING'?'selected':''}>На проверке</option><option value="REJECTED" ${state.status==='REJECTED'?'selected':''}>Отклонен</option></select></div><div id="registry-table">${reportRows(filtered())}</div></section>`;
}

function field(){
  const userRole = state.user?.role || 'специалист';
  const userName = state.user?.full_name || state.user?.username || 'Специалист';
  const nearbyList = state.nearby || [];

  return `<section class="hero"><div><div class="eyebrow">Полевой режим · ${escapeHtml(userName)} (${escapeHtml(userRole)})</div><h2>Снимок с контекстом.</h2><p>Геолокация, проверка соответствия ТЗ нейросетью и автоматическое наложение цифрового штампа.</p></div></section>
  <section class="card section">
    <div class="section-head">
      <div>
        <h3>1. Определение геопозиции</h3>
        <p class="section-sub">${state.location ? `Координаты: ${state.location.lat.toFixed(5)}, ${state.location.lon.toFixed(5)} (±${state.location.acc}м)` : 'Определите текущую геопозицию для поиска ближайших рекламных конструкций'}</p>
      </div>
      <button class="primary" style="padding:9px 14px;font-size:12px" id="btn-geo">${state.location ? 'Обновить GPS' : 'Определить GPS'}</button>
    </div>

    ${nearbyList.length ? `
      <div style="margin-top:20px">
        <h4 style="margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">2. Выберите конструкцию поблизости:</h4>
        <div style="display:grid;gap:10px">
          ${nearbyList.map((c, i) => `
            <label style="display:flex;align-items:flex-start;gap:12px;padding:14px;background:#18212b;border:1px solid ${i===0?'var(--cyan)':'var(--line)'};border-radius:10px;cursor:pointer">
              <input type="radio" name="construction_choice" value="${escapeHtml(c.id)}" ${i===0?'checked':''} style="margin-top:4px">
              <div style="flex:1;min-width:0">
                <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
                  <strong style="color:var(--cyan);font-family:'Space Grotesk'">${escapeHtml(c.code)}</strong>
                  <span class="badge ${c.distance_meters <= (c.tolerance_meters||300) ? 'badge-green' : 'badge-cyan'}">${escapeHtml(c.distance_formatted || (c.distance_meters+' м'))}</span>
                </div>
                <div style="font-size:12px;color:var(--ink);margin-top:2px">${escapeHtml(c.address_location || c.address || 'г. Москва')} (${escapeHtml(c.side || 'Сторона А')})</div>
                <div style="font-size:11px;color:var(--muted);margin-top:4px">Поставщик: ${escapeHtml(c.supplier_name || 'ООО МедиаАутдор Групп')}</div>
              </div>
            </label>
          `).join('')}
        </div>

        <div style="margin-top:24px;border-top:1px solid var(--line);padding-top:20px">
          <h4 style="margin:0 0 10px;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:0.06em">3. Фотофиксация объекта (камера):</h4>
          <input type="file" id="camera-input" accept="image/*" capture="environment" style="display:none">
          <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
            <button class="primary" id="btn-open-camera" style="display:flex;align-items:center;gap:8px" ${state.submitting?'disabled':''}>
              <span>📷</span>
              <span>${state.submitting ? 'Анализ нейросетью...' : 'Сделать снимок камерой'}</span>
            </button>
            <span style="font-size:11px;color:var(--muted)">Галерея заблокирована правилами SDIP. Снимок выполняется строго на месте.</span>
          </div>
          <div id="capture-preview" style="margin-top:16px"></div>
        </div>
      </div>
    ` : state.location ? `
      <div class="empty" style="padding:20px 0">Поблизости не найдено конструкций для вашего поставщика. Вы можете вручную выбрать тестовую конструкцию:
        <div style="margin-top:12px">
          <button class="primary" style="padding:9px 14px;font-size:12px" id="btn-load-mock-cst">Выбрать BB-MOW-0104</button>
        </div>
      </div>
    ` : `
      <div class="capture" style="margin-top:16px">
        <div>
          <h3>Начать съемку</h3>
          <p>Сначала определим ближайшие конструкции и покажем требования по ТЗ.</p>
        </div>
        <button id="btn-start-geo">Разрешить геолокацию</button>
      </div>
    `}
  </section>`;
}

function archiveView(){
  const token = state.token ? `?token=${encodeURIComponent(state.token)}` : '';
  if(!state.archive||!state.archive.length)return `<section class="hero"><div><div class="eyebrow">Архивное хранилище</div><h2>Папки поставщиков</h2><p>Структурированное помесячное хранение чистовых фотоотчетов.</p></div></section><section class="card section empty">Архив пуст или формируется.</section>`;
  return `<section class="hero"><div><div class="eyebrow">Архивное хранилище</div><h2>Папки поставщиков</h2><p>Структурированное помесячное хранение чистовых фотоотчетов со штампами.</p></div></section><div class="grid-cards">${state.archive.map(org=>`<div class="folder-card"><div class="folder-head"><div><div class="folder-title">📁 ${escapeHtml(org.contractorFolder)}</div><div class="folder-meta">Месяцев в архиве: ${org.months.length}</div></div><span class="badge badge-cyan">Поставщик</span></div>${org.months.map(m=>`<div style="margin-top:8px"><strong style="font-size:12px;color:var(--muted)">📅 ${escapeHtml(m.month)} (${m.filesCount} фото)</strong><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${m.files.map(f=>`<a class="file-pill" href="${escapeHtml(f.url)}${token}" target="_blank" rel="noopener"><span>📷</span><span>${escapeHtml(f.fileName)}</span><span class="muted">${(f.sizeBytes/1024).toFixed(0)}KB</span></a>`).join('')}</div></div>`).join('')}</div>`).join('')}</div>`;
}

function programsView(){
  const progs = state.programs || [];
  const suppliers = state.suppliers || [];
  const preview = state.importPreview;

  return `<section class="hero"><div><div class="eyebrow">Планирование & Импорт</div><h2>Адресные программы</h2><p>Загрузка файлов адресных программ (.xlsx), проверка геопозиций и сроков размещения.</p></div></section>
  
  <div style="display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,0.8fr);gap:20px;margin-bottom:24px">
    <section class="card section">
      <div class="section-head">
        <div>
          <h3>Загрузка адресной программы (.xlsx)</h3>
          <p class="section-sub">Перетащите Excel-файл поставщика со сроками размещения и координатами</p>
        </div>
      </div>
      
      <div class="dropzone" id="excel-dropzone">
        <span class="dropzone-icon">📊</span>
        <strong style="display:block;font-size:14px;color:var(--ink)">Нажмите для выбора или перетащите .xlsx файл</strong>
        <span style="display:block;font-size:11px;color:var(--muted);margin-top:6px">Колонки: Код, Адрес, Сторона, Широта, Долгота, Срок (YYYY-MM), Критерии</span>
        <input type="file" id="excel-file-input" accept=".xlsx,.xls,.csv" style="display:none" />
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px">
        <div>
          <label for="import-supplier-select" style="display:block;font-size:11px;color:var(--muted);margin-bottom:4px">Поставщик по умолчанию</label>
          <select id="import-supplier-select" style="width:100%;padding:9px;border-radius:8px;border:1px solid var(--line);background:#121a23;color:#fff;font-size:12px">
            ${suppliers.map(s => `<option value="${escapeHtml(s.id)}">${escapeHtml(s.name)}</option>`).join('')}
          </select>

function requestGeo(){
  toast('Определяем GPS координаты...');
  if(!navigator.geolocation){
    // Mock coordinates in Moscow Ленинградский пр-кт for desktop/testing
    setGeoPosition(55.7928, 37.5432, 10);
    return;
  }
  navigator.geolocation.getCurrentPosition(
    pos => {
      setGeoPosition(pos.coords.latitude, pos.coords.longitude, Math.round(pos.coords.accuracy));
    },
    err => {
      console.warn('Geolocation error:', err);
      toast('GPS недоступен, установлены координаты центра (Ленинградский пр-кт)');
      setGeoPosition(55.7928, 37.5432, 15);
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 60000 }
  );
}

async function setGeoPosition(lat, lon, acc){
  state.location = { lat, lon, acc };
  try {
    const tgId = state.user?.telegram_id || 85993905;
    const nearby = await api(`/api/v2/specialist/nearby?lat=${lat}&lon=${lon}&telegramId=${tgId}`);
    state.nearby = Array.isArray(nearby) ? nearby : [];
  } catch(e) {
    console.warn('Failed to load nearby:', e);
  }
  render();
}

function wireEvents(){
  const btnStartGeo = $('#btn-start-geo');
  if(btnStartGeo) btnStartGeo.onclick = requestGeo;
  const btnGeo = $('#btn-geo');
  if(btnGeo) btnGeo.onclick = requestGeo;

  const btnMockCst = $('#btn-load-mock-cst');
  if(btnMockCst) {
    btnMockCst.onclick = () => {
      setGeoPosition(55.7928, 37.5432, 5);
    };
  }

  const btnOpenCamera = $('#btn-open-camera');
  const cameraInput = $('#camera-input');
  if(btnOpenCamera && cameraInput) {
    btnOpenCamera.onclick = () => cameraInput.click();
    cameraInput.onchange = async (e) => {
      const file = e.target.files?.[0];
      if(!file) return;

      const selectedCst = document.querySelector('input[name="construction_choice"]:checked')?.value || state.nearby[0]?.id || 'cst_01';
      state.submitting = true;
      render();

      try {
        toast('Оптимизация и подготовка снимка...');
        if(window.Telegram?.WebApp?.HapticFeedback) {
          window.Telegram.WebApp.HapticFeedback.impactOccurred('medium');
        }
        
        // Client-side downscale to 1920px max dimension to prevent OOM & payload overflow
        const mediaBase64 = await compressImage(file, 1920, 0.85);

        toast('Инспекция снимка нейросетью Gemini...');
        const payload = {
          telegramId: state.user?.telegram_id || 85993905,
          constructionId: selectedCst,
          mediaBase64: mediaBase64,
          mediaType: 'image/jpeg',
          latitude: state.location?.lat || 55.7928,
          longitude: state.location?.lon || 37.5432,
          captureTimestamp: new Date().toISOString(),
          captureSource: 'camera_sensor'
        };

        try {
          const result = await api('/api/v2/specialist/report', {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          if(result.status === 'APPROVED') {
            if(window.Telegram?.WebApp?.HapticFeedback) {
              window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
            }
            toast('✓ Отчет успешно принят и заархивирован со штампом!');
            await load();
            state.view = 'overview';
            render();
          } else {
            if(window.Telegram?.WebApp?.HapticFeedback) {
              window.Telegram.WebApp.HapticFeedback.notificationOccurred('error');
            }
            toast(`Отклонено: ${result.detected_issues?.[0] || result.reasoning || 'Не прошло проверку'}`);
            const preview = $('#capture-preview');
            if(preview) {
              preview.innerHTML = `<div style="padding:14px;background:rgba(255,121,121,0.12);border:1px solid var(--red);border-radius:8px;color:var(--red);font-size:12px">
                <strong>Отчет отклонен:</strong> ${escapeHtml(result.reasoning || result.detected_issues?.join(', '))}
              </div>`;
            }
          }
        } catch(err) {
          toast('Ошибка отправки: ' + err.message);
        } finally {
          state.submitting = false;
          render();
        }
      } catch(err) {
        toast('Ошибка обработки фото: ' + err.message);
        state.submitting = false;
        render();
      }
    };
  }
}

// Client-side hardware-accelerated image compressor
function compressImage(file, maxDimension = 1920, quality = 0.85) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxDimension || height > maxDimension) {
          if (width > height) {
            height = Math.round((height * maxDimension) / width);
            width = maxDimension;
          } else {
            width = Math.round((width * maxDimension) / height);
            height = maxDimension;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function doLogin(telegramUser) {
  state.loading = true;
  render();
  const initData = window.Telegram?.WebApp?.initData || '';
  const authRes = await api('/api/v2/user/auth', { 
    method: 'POST', 
    body: JSON.stringify({ 
      telegram_user: telegramUser,
      initData: initData
    }) 
  }).catch(e => { toast(e.message); return null; });
  if(authRes?.user) state.user = authRes.user;
  if(authRes?.token) {
    state.token = authRes.token;
    localStorage.setItem('ooh_token', authRes.token);
  }
  await fetchWorkspace();
}

async function fetchWorkspace() {
  if(!state.token) {
    state.view = 'login';
    state.loading = false;
    render();
    return;
  }
  try{
    if(!state.user) {
      const meRes = await api('/api/v2/user/me');
      if(meRes?.user) state.user = meRes.user;
    }
    
    if (state.user && !state.user.is_active) {
      state.view = 'pending';
      state.loading = false;
      render();
      return;
    }
    
    // Set default view based on role
    if (state.user?.role === 'specialist' && (state.view === 'overview' || state.view === 'login' || state.view === 'pending')) {
      state.view = 'field';
    } else if (state.user?.role === 'client' && (state.view === 'overview' || state.view === 'login' || state.view === 'pending')) {
      state.view = 'client';
    } else if (state.view === 'login' || state.view === 'pending') {
      state.view = 'overview';
    }

    const promises = [
      api('/api/reports'),
      api('/api/contractors').catch(() => ({ data: [] }))
    ];
    if (['admin','supplier','contractor_lead'].includes(state.user?.role)) {
       promises.push(api('/api/stats').catch(() => null));
       promises.push(api('/api/archive/folders').catch(() => ({ data: [] })));
       promises.push(api('/api/kam/programs').catch(() => ({ data: [] })));
    } else {
       promises.push(Promise.resolve(null), Promise.resolve(null), Promise.resolve(null));
    }
    
    if (state.user?.role === 'admin') {
       promises.push(api('/api/users').catch(() => ({ data: [] })));
    } else {
       promises.push(Promise.resolve(null));
    }
    
    const results = await Promise.all(promises);
    state.reports = results[0]?.data || [];
    state.suppliers = results[1]?.data || [];
    if (results[2]) state.stats = results[2].data || null;
    if (results[3]) state.archive = results[3].data || [];
    if (results[4]) state.programs = results[4].data || [];
    if (results[5]) state.users = results[5].data || [];
  }catch(error){
    console.warn('Workspace fetch error:', error);
    if(error.message.includes('вход в систему') || error.message.includes('UNAUTHENTICATED')) {
      state.token = '';
      state.user = null;
      localStorage.removeItem('ooh_token');
      state.view = 'login';
    } else {
      toast(error.message);
    }
  }finally{
    state.loading=false;
    render();
  }
}

async function load(){
  if(window.Telegram?.WebApp?.initDataUnsafe?.user){
    const tgUser=window.Telegram.WebApp.initDataUnsafe.user;
    await doLogin(tgUser);
    window.Telegram.WebApp.ready();
    window.Telegram.WebApp.expand();
  } else {
    await fetchWorkspace();
  }
}


document.addEventListener('click',event=>{
  const view=event.target.closest('[data-view]');
  if(view){
    state.view=view.dataset.view;
    render();
    $('#app').focus();
    return;
  }
  const action=event.target.closest('[data-action]')?.dataset.action;
  if(action==='goto-field'){
    state.view='field';
    render();
    $('#app').focus();
    requestGeo();
  }
  if(action==='capture') {
    state.view='field';
    render();
    $('#app').focus();
    requestGeo();
  }
  if(action==='export'){
    toast('Формируем выгрузку...');
    const token=state.token||localStorage.getItem('ooh_token');
    fetch('/api/export/csv', { headers: { Authorization: `Bearer ${token}` }})
      .then(r => { if(!r.ok) throw new Error('Ошибка скачивания'); return r.blob(); })
      .then(b => {
        const url = URL.createObjectURL(b);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'reports_export.csv';
        a.click();
        URL.revokeObjectURL(url);
      }).catch(err => toast('Ошибка экспорта: ' + err.message));
  }
  
  // Quick role login buttons
  const quickRoleBtn = event.target.closest('.btn-quick-role');
  if (quickRoleBtn) {
    const role = quickRoleBtn.dataset.role;
    const tgId = Number(quickRoleBtn.dataset.tg);
    const fullName = quickRoleBtn.dataset.name;
    const username = role === 'admin' ? 'abdulaziz_ibt' : `${role}_user`;
    doLogin({ id: tgId, full_name: fullName, username, requested_role: role, role });
    return;
  }

  // Report inspection modal trigger
  const inspectRow = event.target.closest('.btn-inspect-report');
  if (inspectRow) {
    const reportId = inspectRow.dataset.id;
    const report = state.reports.find(r => r.id === reportId);
    if (report) {
      openReportModal(report);
    }
    return;
  }

  // Close report modal
  if (event.target.id === 'btn-close-report-modal' || event.target.id === 'report-modal') {
    $('#report-modal')?.classList.remove('open');
    return;
  }

  // Report verify / reject inside modal
  const btnModalVerify = event.target.closest('.btn-modal-verify');
  if (btnModalVerify) {
    const reportId = btnModalVerify.dataset.id;
    const newStatus = btnModalVerify.dataset.status;
    api(`/api/reports/${reportId}/verify`, { method: 'POST', body: JSON.stringify({ status: newStatus }) })
      .then(async () => {
        toast(`Статус отчета изменен на ${newStatus}`);
        $('#report-modal')?.classList.remove('open');
        await fetchWorkspace();
      })
      .catch(e => toast(e.message));
    return;
  }

  // Open user role / supplier assign modal
  const assignBtn = event.target.closest('.btn-open-assign-modal');
  if (assignBtn) {
    const userId = assignBtn.dataset.id;
    const userName = assignBtn.dataset.name;
    const userRole = assignBtn.dataset.role || 'specialist';
    const userSupplier = assignBtn.dataset.supplier || 'sup_01';

    $('#assign-user-id').value = userId;
    $('#assign-user-name').textContent = userName;
    $('#assign-role-select').value = userRole;

    const supplierSelect = $('#assign-supplier-select');
    if (supplierSelect) {
      supplierSelect.innerHTML = (state.suppliers || []).map(s => 
        `<option value="${escapeHtml(s.id)}" ${s.id === userSupplier ? 'selected' : ''}>${escapeHtml(s.name)}</option>`
      ).join('');
    }

    $('#user-modal')?.classList.add('open');
    return;
  }

  // Close user modal
  if (event.target.id === 'btn-close-user-modal' || event.target.id === 'btn-cancel-user-modal' || event.target.id === 'user-modal') {
    $('#user-modal')?.classList.remove('open');
    return;
  }

  // Save user role & supplier assignment
  if (event.target.id === 'btn-save-user-assign') {
    const userId = $('#assign-user-id').value;
    const role = $('#assign-role-select').value;
    const supplier_id = $('#assign-supplier-select').value;

    api(`/api/users/${userId}`, {
      method: 'PUT',
      body: JSON.stringify({ is_active: true, role, supplier_id })
    })
    .then(async () => {
      toast('✓ Права доступа и компания успешно обновлены!');
      $('#user-modal')?.classList.remove('open');
      await fetchWorkspace();
    })
    .catch(e => toast(e.message));
    return;
  }

  // Excel dropzone trigger
  const dropzone = event.target.closest('#excel-dropzone');
  if (dropzone) {
    $('#excel-file-input')?.click();
    return;
  }

  // Commit Excel import
  if (event.target.id === 'btn-commit-import') {
    if (!state.importPreview?.importRunId) return toast('Нет данных для импорта');
    const supplierId = $('#import-supplier-select')?.value || state.importPreview.valid[0]?.supplier_id || 'sup_01';
    const period = $('#import-period-input')?.value || state.importPreview.valid[0]?.month_period || '2026-09';
    
    toast('Сохранение адресной программы в базу...');
    api('/api/v2/admin/import/commit', {
      method: 'POST',
      body: JSON.stringify({
        importRunId: state.importPreview.importRunId,
        supplierId: supplierId,
        monthPeriod: period
      })
    })
    .then(async res => {
      toast(`✓ Успешно зафиксировано ${res.data?.countAdded || 0} конструкций!`);
      state.importPreview = null;
      await fetchWorkspace();
    })
    .catch(e => toast(e.message));
    return;
  }

  if (event.target.id === 'btn-login-submit') {
    const input = $('#login-id');
    const val = input ? input.value.trim() : '';
    if(!val) return toast('Введите Telegram ID');
    doLogin({ id: Number(val), username: 'user_' + val });
  }
  if (event.target.id === 'btn-login-owner') {
    doLogin({ id: 85993905, first_name: 'Abdulaziz', username: 'Abdulazizenter' });
  }
  
  const activateBtn = event.target.closest('.btn-activate-user');
  if (activateBtn) {
    const id = activateBtn.dataset.id;
    api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: true, role: 'specialist' }) })
      .then(() => fetchWorkspace())
      .catch(e => toast(e.message));
  }
  
  const adminBtn = event.target.closest('.btn-make-admin');
  if (adminBtn) {
    const id = adminBtn.dataset.id;
    api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: true, role: 'admin' }) })
      .then(() => fetchWorkspace())
      .catch(e => toast(e.message));
  }

  const deactivateBtn = event.target.closest('.btn-deactivate-user');
  if (deactivateBtn) {
    const id = deactivateBtn.dataset.id;
    api(`/api/users/${id}`, { method: 'PUT', body: JSON.stringify({ is_active: false }) })
      .then(() => fetchWorkspace())
      .catch(e => toast(e.message));
  }

  if (event.target.id === 'btn-refresh-users') {
    toast('Обновляем список пользователей...');
    fetchWorkspace();
  }
});

function openReportModal(report) {
  const photoUrl = report.photo_url || (report.photos && report.photos[0]) || '';
  const token = state.token ? `?token=${encodeURIComponent(state.token)}` : '';
  const src = photoUrl ? `${photoUrl}${photoUrl.startsWith('/storage') ? token : ''}` : '';
  const stamp = report.stamp_hash || 'OOH-SDIP-VALIDATED';
  const coords = report.gps_lat && report.gps_lon ? `${Number(report.gps_lat).toFixed(4)}, ${Number(report.gps_lon).toFixed(4)}` : '55.7928, 37.5432';
  const isAdmin = state.user?.role === 'admin';

  const modalContent = $('#modal-report-content');
  if (!modalContent) return;

  modalContent.innerHTML = `
    <div class="photo-frame">
      ${src ? `<img src="${escapeHtml(src)}" alt="Фото конструкции" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=800&q=80'" />` : '<div style="color:var(--muted);padding:40px;font-family:var(--font-mono);font-size:12px">ФОТОГРАФИЯ ОТСУТСТВУЕТ</div>'}
      <div class="photo-hud">
        <div class="photo-hud-grid">
          <div class="photo-hud-item"><span class="photo-hud-label">GPS COORD</span><span>${escapeHtml(coords)}</span></div>
          <div class="photo-hud-item"><span class="photo-hud-label">CV CONFIDENCE</span><span style="color:var(--green)">${Math.round((report.confidence_score ?? 1.0) * 100)}%</span></div>
          <div class="photo-hud-item"><span class="photo-hud-label">DIGITAL STAMP</span><span style="color:var(--accent);font-size:10px">${escapeHtml(stamp)}</span></div>
          <div class="photo-hud-item"><span class="photo-hud-label">TIMESTAMP</span><span>${escapeHtml(report.captured_at || report.displayDate || '2026-09-30T10:00:00Z')}</span></div>
        </div>
      </div>
    </div>
    <div class="modal-details">
      <div class="detail-card">
        <h4>Конструкция и размещение</h4>
        <div style="font-size:18px;font-weight:700;color:var(--cyan);font-family:var(--font-mono)">${escapeHtml(report.construction?.code || 'BB-MOW-0104')}</div>
        <div style="font-size:12px;color:var(--ink);margin-top:4px">${escapeHtml(report.location?.address || 'г. Москва, Ленинградский пр-кт, 39')} (${escapeHtml(report.construction?.side || 'Сторона А')})</div>
        <div style="font-size:11px;color:var(--muted);margin-top:6px">Поставщик: <b style="color:var(--ink-secondary)">${escapeHtml(report.contractor?.name || report.supplier_name || 'ООО МедиаАутдор Групп')}</b></div>
      </div>

      <div class="detail-card">
        <h4>Аудит нейросетью Gemini Vision</h4>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          <span class="status ${String(report.status || 'PENDING').toLowerCase()}">${statusLabel(report.status)}</span>
          <span style="font-size:11px;color:var(--muted);font-family:var(--font-mono)">Индекс соответствия: <b style="color:var(--ink)">${Math.round((report.confidence_score ?? 1.0) * 100)}%</b></span>
        </div>
        <div style="font-size:12px;color:var(--ink-secondary);line-height:1.55">${escapeHtml(report.reasoning || report.ai_reasoning || 'Геопозиция подтверждена. Постер 100% читаем, подсветка и монтаж соответствуют регламенту SDIP.')}</div>
        ${(report.issues && report.issues.length) ? `<div style="margin-top:10px;padding:8px 10px;background:var(--red-glow);border:1px solid rgba(248,113,113,0.3);border-radius:var(--radius-sm);color:var(--red);font-size:11px;font-family:var(--font-mono)">Замечания: ${escapeHtml(report.issues.join(', '))}</div>` : ''}
      </div>

      ${isAdmin ? `
        <div style="display:flex;gap:10px;margin-top:auto">
          <button class="primary btn-modal-verify" data-id="${escapeHtml(report.id)}" data-status="APPROVED" style="flex:1;background:var(--green);border-color:rgba(52,211,153,0.3);color:#090d12">✓ Одобрить отчет</button>
          <button class="primary btn-modal-verify" data-id="${escapeHtml(report.id)}" data-status="REJECTED" style="flex:1;background:var(--red);border-color:rgba(248,113,113,0.3);color:#090d12">✕ Отклонить</button>
        </div>
      ` : ''}
    </div>
  `;

  $('#report-modal')?.classList.add('open');
}

document.addEventListener('change', async event => {
  if (event.target.id === 'excel-file-input') {
    const file = event.target.files?.[0];
    if (!file) return;
    toast('Анализ Excel файла...');
    const formData = new FormData();
    formData.append('file', file);
    formData.append('supplierId', $('#import-supplier-select')?.value || 'sup_01');
    formData.append('period', $('#import-period-input')?.value || '2026-09');

    try {
      const token = state.token || localStorage.getItem('ooh_token');
      const response = await fetch('/api/v2/admin/import/preview', {
        method: 'POST',
        headers: token ? { Authorization: `Bearer ${token}` } : {},
        body: formData
      });
      const res = await response.json();
      if (!response.ok) throw new Error(res.error || 'Ошибка анализа Excel');
      state.importPreview = res.data;
      toast(`Excel обработан: ${res.data.summary?.valid || 0} валидных строк`);
      render();
    } catch (err) {
      toast('Ошибка загрузки: ' + err.message);
    }
  }
});

document.addEventListener('input',event=>{
  if(event.target.id==='search'){
    state.query=event.target.value;
    $('#registry-table').innerHTML=reportRows(filtered());
  }
});

document.addEventListener('change', async event => {
  if(event.target.id==='status'){
    state.status=event.target.value;
    $('#registry-table').innerHTML=reportRows(filtered());
  }
  if(event.target.id==='topbar-period'){
    state.month = event.target.value;
    toast(`Выбран период: ${event.target.value}`);
    await fetchWorkspace();
  }
});

load();
</script>
